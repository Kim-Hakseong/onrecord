[project]
name = "onrecord"
version = "0.1.0"
description = "Phone calls that end in records, not summaries. A field-level adjudication layer for CALL-E."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "K_Haku" }]
dependencies = [
    "calle-ai>=0.7.0",
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "mcp>=1.2.0",
]

[project.scripts]
onrecord = "onrecord.cli:main"
onrecord-mcp = "onrecord.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onrecord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.1",
    "anyio>=4.15.1",
]
